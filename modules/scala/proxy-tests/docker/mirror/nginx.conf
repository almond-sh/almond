# Repository mirror the mirror tests point Almond at: a plain HTTP reverse proxy of the
# repositories the kernels resolve from, the way an organization's repository manager (Nexus,
# Artifactory, …) makes Maven Central available on an internal network.
#
# The mirror runs on a network that reaches the outside, and is the only thing the containers the
# kernels run in can reach.

server {
    listen 80;

    location /maven2/ {
        proxy_pass https://repo1.maven.org/maven2/;
        proxy_ssl_server_name on;
        proxy_set_header Host repo1.maven.org;
    }

    location /maven-snapshots/ {
        proxy_pass https://central.sonatype.com/repository/maven-snapshots/;
        proxy_ssl_server_name on;
        proxy_set_header Host central.sonatype.com;
    }

    location /jitpack/ {
        proxy_pass https://jitpack.io/;
        proxy_ssl_server_name on;
        proxy_set_header Host jitpack.io;
    }
}

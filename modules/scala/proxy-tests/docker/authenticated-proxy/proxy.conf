# Forward proxy, requiring HTTP Basic authentication - the credentials are in the htpasswd file
# the Dockerfile writes (user "jack", password "insecure").

# The apache2-proxy package may already load these from its own configuration file
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_connect_module>
    LoadModule proxy_connect_module modules/mod_proxy_connect.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

ProxyRequests On

<Proxy "*">
    AuthType Basic
    AuthName "Almond proxy tests"
    AuthUserFile /etc/apache2/htpasswd
    Require valid-user
</Proxy>

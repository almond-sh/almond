name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only runs on main save caches, and pull requests restore those. The ones pull requests would
# save could only be restored by later runs of the same pull request, and would evict those of
# main, as a repository only gets 10 GB of caches. For main's caches to fit in there, jobs share a
# cache per OS (the Linux integration tests getting their own one), and only one job writes each
# of them, the one fetching the most dependencies. The others only restore them (cacheMode: read),
# and fetch what they lack on their own. Besides the coursier cache, coursier/cache-action handles
# the Mill one, which has the Mill distributions the ./mill launcher downloads.
jobs:
  scala-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      json: ${{ steps.versions.outputs.json }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        cacheMode: read
    - id: versions
      run: echo "json=$(./mill -i dev.ciScalaVersionsJson)" >> "$GITHUB_OUTPUT"

  examples:
    runs-on: ${{ matrix.OS }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        OS: ["ubuntu-latest", "windows-latest"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        cacheMode: read
    # Only run the tests affected by the changes of pull requests (runs everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    # Runs the example notebooks with each of the Scala versions of ScalaVersions.examples
    - run: ./mill -i selective.run 'scala.examples[_].test'

  test:
    needs: scala-versions
    runs-on: ${{ matrix.OS }}
    # Usually takes a few minutes, fail fast rather than waiting for GitHub's 6h default on a hang
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        OS: [ubuntu-latest]
        SCALA: ${{ fromJSON(needs.scala-versions.outputs.json).all }}
        include:
          - OS: windows-latest
            SCALA: ${{ fromJSON(needs.scala-versions.outputs.json).scala213 }}
          - OS: macos-15
            SCALA: ${{ fromJSON(needs.scala-versions.outputs.json).scala213 }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        cacheMode: read
    # Only run the tests affected by the changes of pull requests (runs everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    # Modules are built once per binary Scala version, and their tests once per full Scala
    # version - the former selector runs the tests of the modules that have no full Scala
    # version cross, the latter the tests of those that do. The latter names the test task
    # explicitly, so that modules that merely happen to be named "test" are left out.
    - run: |
        ./mill -i selective.run "__[$BINARY_SCALA].test"
        ./mill -i selective.run "__.test[$SCALA].testForked"
      shell: bash
      if: runner.os != 'Windows'
      env:
        SCALA: ${{ matrix.SCALA.scalaVersion }}
        BINARY_SCALA: ${{ matrix.SCALA.binaryScalaVersion }}
    - run: |
        ./mill -i selective.run __[%BINARY_SCALA%].test
        ./mill -i selective.run __.test[%SCALA%].testForked
      if: runner.os == 'Windows'
      env:
        SCALA: ${{ matrix.SCALA.scalaVersion }}
        BINARY_SCALA: ${{ matrix.SCALA.binaryScalaVersion }}

  echo:
    # The echo demo kernel is built for Scala 3 only, so the cross-version test job above
    # doesn't pick its tests up.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        cacheMode: read
    # Only run the tests affected by the changes of pull requests (runs everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    - run: ./mill -i selective.run echo.test
      shell: bash

  integration-tests:
    runs-on: ${{ matrix.OS }}
    # Room for the retry below to run the suite a second time on a transient infrastructure flake.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Not on ubuntu-22.04, whose GLIBC is too old for the native Mill launcher - the JVM-based
        # one it falls back to there needs a java command on the PATH, that we don't install.
        OS: [ubuntu-latest, macos-15, windows-latest]
        GROUP: ["212", "213", "3"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os == 'Linux' && 'Linux-integration' || runner.os }}
        ignoreMatrix: true
        # Except on Windows, group 213 runs KernelTestsTwoStepStartup, whose kernels switch to every
        # Scala version we test. On macOS and Windows, this saves the cache of all the jobs there.
        cacheMode: ${{ github.ref == 'refs/heads/main' && matrix.GROUP == '213' && 'write' || 'read' }}
    # Only run the tests affected by the changes of pull requests (runs everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    # Retry the whole suite once as a backstop: the integration tests occasionally hit transient
    # infrastructure issues (overloaded runner, ZeroMQ connection timeouts) that the in-test retries
    # don't fully absorb. This is a coarse safety net - the per-test retries and the ZeroMQ cleanup
    # fixes in the test harness should keep it from triggering in the common case.
    - name: Run integration tests
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 75
        max_attempts: 2
        retry_on: error
        shell: bash
        command: .github/scripts/run/run-its.sh ${{ matrix.GROUP }}

  proxy-tests:
    # Docker-based tests: the kernels are installed and run from containers that can't reach Maven
    # Central, only an authenticated proxy or a repository mirror (see docs/pages/install-proxies.md).
    # Docker only being around on the Linux runners, these run on Linux only.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        cacheMode: read
    - run: ./mill -i scala.proxy-tests.test
      shell: bash

  oss-scanner:
    # Builds the image the OSS Scanner (https://github.com/anthropics/oss-scanner) scans us in, from
    # .oss-scanner/Dockerfile, and checks that tests run in it without network access. On pull
    # requests, only when that Dockerfile, the selectors of the commands it runs (like when the
    # Scala versions are updated), or the code of the check itself change.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        cacheMode: read
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    - id: selective
      run: |
        tasks="$(./mill -i --ticker false selective.resolve oss-scanner.dockerCheck)"
        echo "Selected tasks: ${tasks:-none}"
        if [ -n "$tasks" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    # The image holds the dependencies of several Scala versions, and the compiled modules and
    # tests for them
    - name: Free disk space
      if: steps.selective.outputs.run == 'true'
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
      shell: bash
    - if: steps.selective.outputs.run == 'true'
      run: ./mill -i oss-scanner.dockerCheck
      shell: bash

  bincompat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        cacheMode: read
    # Only check the modules affected by the changes of pull requests (checks everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    - run: ./mill selective.run __.mimaReportBinaryIssues
      shell: bash

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        cacheMode: read
    - run: ./mill docs.generate
      shell: bash

  format:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps: scalafmt
    - run: scalafmt --check

  publishLocal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.2.0
      with:
        job: ${{ runner.os }}
        ignoreMatrix: true
        # This job compiles every module, for all the Scala versions we publish for
        cacheMode: ${{ github.ref == 'refs/heads/main' && 'write' || 'read' }}
    - run: |
        mv .mill-jvm-opts .mill-jvm-opts.bak
        echo "-Xmx2g" > .mill-jvm-opts
        cat .mill-jvm-opts.bak | grep -v Xmx >> .mill-jvm-opts
        # sometimes running into memory issues when attempting __.publishLocal upfront
        for SV in $(./mill -i dev.binaryScalaVersions); do
          ./mill -i '__['"$SV"'].compile'
          ./mill -i '__['"$SV"'].docJar'
          ./mill -i '__['"$SV"'].publishLocal'
        done
        ./mill -i __.publishLocal
      shell: bash

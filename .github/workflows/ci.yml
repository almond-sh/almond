name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scala-versions:
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.versions.outputs.json }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    - id: versions
      run: echo "json=$(./mill -i dev.ciScalaVersionsJson)" >> "$GITHUB_OUTPUT"

  examples:
    runs-on: ${{ matrix.OS }}
    strategy:
      fail-fast: false
      matrix:
        OS: ["ubuntu-latest", "windows-latest"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    # Only run the tests affected by the changes of pull requests (runs everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    - run: ./mill -i selective.run scala.examples.test

  test:
    needs: scala-versions
    runs-on: ${{ matrix.OS }}
    strategy:
      fail-fast: false
      matrix:
        OS: [ubuntu-latest]
        SCALA: ${{ fromJSON(needs.scala-versions.outputs.json).all }}
        include:
          - OS: windows-latest
            SCALA: ${{ fromJSON(needs.scala-versions.outputs.json).scala213 }}
          - OS: macos-15
            SCALA: ${{ fromJSON(needs.scala-versions.outputs.json).scala213 }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps:
    # Only run the tests affected by the changes of pull requests (runs everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    # Modules are built once per binary Scala version, and their tests once per full Scala
    # version - the former selector runs the tests of the modules that have no full Scala
    # version cross, the latter the tests of those that do. The latter names the test task
    # explicitly, so that modules that merely happen to be named "test" are left out.
    - run: |
        ./mill -i selective.run "__[$BINARY_SCALA].test"
        ./mill -i selective.run "__.test[$SCALA].testForked"
      shell: bash
      if: runner.os != 'Windows'
      env:
        SCALA: ${{ matrix.SCALA.scalaVersion }}
        BINARY_SCALA: ${{ matrix.SCALA.binaryScalaVersion }}
    - run: |
        ./mill -i selective.run __[%BINARY_SCALA%].test
        ./mill -i selective.run __.test[%SCALA%].testForked
      if: runner.os == 'Windows'
      env:
        SCALA: ${{ matrix.SCALA.scalaVersion }}
        BINARY_SCALA: ${{ matrix.SCALA.binaryScalaVersion }}

  echo:
    # The echo demo kernel is built for Scala 3 only, so the cross-version test job above
    # doesn't pick its tests up.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps:
    # Only run the tests affected by the changes of pull requests (runs everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    - run: ./mill -i selective.run echo.test
      shell: bash

  integration-tests:
    runs-on: ${{ matrix.OS }}
    # Room for the retry below to run the suite a second time on a transient infrastructure flake.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        OS: ["ubuntu-22.04", macos-15, windows-latest]
        GROUP: ["212", "213", "3"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps: scala-cli
    # Only run the tests affected by the changes of pull requests (runs everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    # Retry the whole suite once as a backstop: the integration tests occasionally hit transient
    # infrastructure issues (overloaded runner, ZeroMQ connection timeouts) that the in-test retries
    # don't fully absorb. This is a coarse safety net - the per-test retries and the ZeroMQ cleanup
    # fixes in the test harness should keep it from triggering in the common case.
    - name: Run integration tests
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 75
        max_attempts: 2
        retry_on: error
        shell: bash
        command: .github/scripts/run/run-its.sh ${{ matrix.GROUP }}

  proxy-tests:
    # Docker-based tests: the kernels are installed and run from containers that can't reach Maven
    # Central, only an authenticated proxy or a repository mirror (see docs/pages/install-proxies.md).
    # Docker only being around on the Linux runners, these run on Linux only.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    # -j 1 like the integration tests: the localRepo tasks don't like being run in parallel
    - run: ./mill -i -j 1 scala.proxy-tests.test
      shell: bash

  bincompat:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
    # Only check the modules affected by the changes of pull requests (checks everything elsewhere)
    - run: .github/scripts/selective-prepare.sh
      shell: bash
    - run: ./mill selective.run __.mimaReportBinaryIssues
      shell: bash

  website:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps: cs
    - run: ./mill docs.generate
      shell: bash

  format:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps: scalafmt
    - run: scalafmt --check

  publishLocal:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 21
        apps:
    - run: |
        mv .mill-jvm-opts .mill-jvm-opts.bak
        echo "-Xmx2g" > .mill-jvm-opts
        cat .mill-jvm-opts.bak | grep -v Xmx >> .mill-jvm-opts
        # sometimes running into memory issues when attempting __.publishLocal upfront
        for SV in $(./mill -i dev.binaryScalaVersions); do
          ./mill -i '__['"$SV"'].compile'
          ./mill -i '__['"$SV"'].docJar'
          ./mill -i '__['"$SV"'].publishLocal'
        done
        ./mill -i __.publishLocal
      shell: bash

[project]
name = "almond-examples"
version = "0.0.0"
description = "Jupyter environment used to run the almond example notebooks and the dev.jupyter* mill commands"
requires-python = ">=3.10"
dependencies = [
  "jupyter-client>=8",
  "jupyter-console>=6.6",
  "jupyterlab>=4",
  "notebook>=7",
  "nbconvert>=7.17",
]

# Only installed by the dev.jupyter* commands starting JupyterLab (via `uv run --group ai`),
# not by the example tests. The Claude and Codex personas of Jupyter AI also need the
# `claude-agent-acp` and `codex-acp` commands, installed by the build from `acp-agents/`.
[dependency-groups]
ai = [
  "jupyter-ai>=3",
]

[tool.uv]
package = false
